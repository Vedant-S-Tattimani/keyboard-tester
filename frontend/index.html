    <!-- MVP SEO Reqs -->
    <title>KeyCheck — Web-Based Keyboard Tester and Diagnostic Tool</title>
    <meta name="description" content="Test your keyboard online. KeyCheck provides instant visual feedback, ghosting tests, typing tests, and raw event inspection entirely within your browser." />
    
    <!-- Multi-Language Hreflang SEO -->
    <link rel="canonical" href="https://keyboardtester1.com/en" />
    <link rel="alternate" hreflang="en" href="https://keyboardtester1.com/en" />

  </head>
  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('keyboard_tester_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
