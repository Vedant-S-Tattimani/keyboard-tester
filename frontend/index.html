<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- MVP SEO Reqs -->
    <title>KeyCheck — Web-Based Keyboard Tester and Diagnostic Tool</title>
    <meta name="description" content="Test your keyboard online. KeyCheck provides instant visual feedback, ghosting tests, typing tests, and raw event inspection entirely within your browser." />
    
  </head>
  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('keyboard_tester_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches) || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
